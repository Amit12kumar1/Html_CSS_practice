<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- <button type="menu"> Click me</button> -->

    <center>
    <form action=""> 
        <caption>Student form</caption>
        <br>
        <table border="2">
            <tr>
                <th>        <label for="">Name:</label>
                </th>
                <td>
                    <input type="text" name="studentName" placeholder="Name">

                </td>
            </tr>
            <tr>
                <th>
                    Class: 
                </th>
                <td>
                    <input type="text" name="class">

                </td>

            </tr>
            <tr>
                <th>
                    DOB:
                </th>
                <td>
                    <input type="date" name="dob">
                </td>
            </tr>
            <tr>
                <th>
                    Password:
                </th>
                <td>
                    <input type="password" maxlength="10">
                </td>
            </tr>
            <tr>
                <th>
                    Address:
                </th>
                <td>
                    <textarea name="" id="" cols="20" rows="5" style="display: block;" placeholder="address"></textarea>
                </td>
            </tr>
            <tr>
                <th>
                    Gender:
                </th>
                <td>
                    Male: <input type="radio" name="rd1">
                    female: <input type="radio" name="rd1">
                </td>
            </tr>
            <tr>
                <th>
                    city:
                </th>
                <td>
                    <select name="" id="">
                        <option value="" ></option>
                        <option value="">
                            patna
                        </option>
                        <option value=""> 
                            gaya
                        </option>
                        <option value="" selected>
                            nawada
                        </option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>
                    subject:
                </th>
                <td>
                    Math <input type="checkbox" checked>
                    Eng <input type="checkbox" checked>
                    Sst <input type="checkbox">
                    science <input type="checkbox">
                </td>
            </tr>
                <tr>
                    <th>
                        Time:
                    </th>
                    <td>
                        <input type="time">
                    </td>
                </tr>
                <tr>
                    <th>
                        E-mail:
                    </th>
                    <td>
                        <input type="email">
                    </td>
                </tr>
           <tr>
            <th>
                File:
            </th>
            <td>
                <input type="file">
            </td>
           </tr>
           <tr>
            <td>
            
                <input type="submit">
                <input type="reset">
            
            </td>
        </th>
           </tr>
        </table>
        <br>
    </form>
</center>
    
</body>
</html>
